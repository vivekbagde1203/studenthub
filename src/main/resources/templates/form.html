<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudentHub — Student Form</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div class="layout"><aside class="sidebar"><div class="brand">✦ Student<span>Hub</span></div><a class="navitem active" href="/">▦ &nbsp; Dashboard</a><div class="sidebar-bottom">Jenkins + Docker Lab</div></aside><main><header><div><div class="eyebrow">STUDENT MANAGEMENT</div><h1 th:text="${heading}">Add new student</h1><p class="muted">Fill out the details below to save the student.</p></div><a class="btn secondary" href="/">← Back to dashboard</a></header><section class="panel form-panel"><form th:action="@{/students/save}" th:object="${student}" method="post"><input type="hidden" th:field="*{id}"/><div class="form-grid"><label>Full name<input th:field="*{name}" required maxlength="100" placeholder="e.g. Priya Sharma"/><small class="error" th:errors="*{name}"></small></label><label>Email address<input th:field="*{email}" type="email" required maxlength="150" placeholder="priya@example.com"/><small class="error" th:errors="*{email}"></small></label><label>Course<input th:field="*{course}" required maxlength="80" placeholder="e.g. DevOps Engineering"/><small class="error" th:errors="*{course}"></small></label><label>Age<input th:field="*{age}" type="number" required min="5" max="100" placeholder="e.g. 21"/><small class="error" th:errors="*{age}"></small></label><label>Phone number<input th:field="*{phone}" maxlength="25" placeholder="e.g. 9876543210"/><small class="error" th:errors="*{phone}"></small></label></div><div class="form-actions"><a class="btn secondary" href="/">Cancel</a><button class="btn" type="submit">Save Student</button></div></form></section></main></div></body></html>
